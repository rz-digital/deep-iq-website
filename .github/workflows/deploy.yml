name: Deploy DeepIQ

# Manual only — pick the branch (default: develop) in the Actions tab and click
# "Run workflow". Nothing runs automatically on push.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this deploy (shows in the run log)'
        required: false
        default: ''

permissions:
  contents: write   # needed so this workflow can commit + push the version bump

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show deploy note
        if: ${{ inputs.note != '' }}
        run: |
          echo "Deploy note: ${{ inputs.note }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version and tag
        # Every deploy auto-bumps the patch version (1.0.1 -> 1.0.2, ...) and
        # publishes it as a commit + tag using this run's own GITHUB_TOKEN — not
        # your machine's git access, and separate from it entirely.
        # For a deliberate minor/major bump, run `npm version minor|major`
        # yourself, commit, and push — the next auto-run continues the patch
        # count from there.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          git commit -am "chore(release): $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$NEW_VERSION"
          echo "RELEASE=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Build
        # Also regenerates deploy/nginx-routes.conf and validates page.json /
        # site-content.json — fails loudly here rather than publishing a broken site.
        run: npm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ERROR_MONITORING_ENDPOINT: ${{ secrets.VITE_ERROR_MONITORING_ENDPOINT }}
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENVIRONMENT: production
          VITE_APP_RELEASE: ${{ github.sha }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin the VM's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build to a new release directory
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -e
            if [ -d /var/www/deepiq/releases/$RELEASE ]; then
              echo "Release $RELEASE already exists on the server." >&2
              echo "Bump the version in package.json (npm version patch/minor/major) and push before deploying again." >&2
              exit 1
            fi
            mkdir -p /var/www/deepiq/releases/$RELEASE
          EOF
          rsync -avz --delete dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/deepiq/releases/$RELEASE/"
          rsync -avz deploy/nginx-routes.conf \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/deepiq/nginx-routes.conf"

      - name: Activate release and reload nginx
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -e
            ln -sfn /var/www/deepiq/releases/$RELEASE /var/www/deepiq/current
            cd /var/www/deepiq/releases
            ls -1t | tail -n +6 | xargs -r rm -rf --
            sudo /usr/sbin/nginx -t
            sudo /usr/bin/systemctl reload nginx
          EOF

      - name: Smoke test
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' https://deepiq.lk/)
          echo "https://deepiq.lk/ -> $code"
          test "$code" = "200"
